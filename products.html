<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy | Products</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <div class="logo">ShopEasy</div>
            <div class="menu-toggle" id="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <input type="text" id="search-input" placeholder="Search products...">
                <div class="cart-icon" id="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <span id="close-cart">&times;</span>
        </div>
        <div id="cart-items">
            <!-- Cart items will be injected here by JavaScript -->
        </div>
        <div class="cart-summary">
            <h3>Total: $<span id="cart-total">0.00</span></h3>
            <button class="btn" style="width: 100%; margin-top: 1rem;">Checkout</button>
        </div>
    </div>

    <!-- Products Section -->
    <section>
        <h1 class="section-title">Our Products</h1>
        
        <!-- Category Filters -->
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="electronics">Electronics</button>
            <button class="filter-btn" data-category="clothing">Clothing</button>
            <button class="filter-btn" data-category="home">Home & Living</button>
        </div>

        <!-- Products Grid Container -->
        <div class="products-grid" id="products-container">
            <!-- All products will be injected here by JavaScript based on filters -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ShopEasy. All rights reserved.</p>
    </footer>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
